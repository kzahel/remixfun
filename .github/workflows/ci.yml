name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check repository documents and configuration
        run: python -X utf8 scripts/check_repo.py
      - name: Check whitespace
        run: git diff --check

  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv==0.11.32
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - run: uv run python scripts/smoke_service.py
      - name: Install browser test runtime
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser contract tests
        if: runner.os == 'Linux'
        run: npm --prefix web test

  windows-preview:
    runs-on: windows-latest
    env:
      REMIXFUN_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv==0.11.32
      - run: uv sync --locked
      - run: npm ci --prefix web
      - name: Build unsigned developer folder
        run: uv run python scripts/build_local.py
      - name: Desktop attachment identity contract
        run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Test frozen service and bundled web frontend
        run: uv run python scripts/smoke_service.py --executable dist/desktop-preview/remixfun-service.exe
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-developer-preview
          path: dist/desktop-preview/
          retention-days: 7
